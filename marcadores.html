<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcadores - Búsqueda del Tesoro AR</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top, #2a2000, #000) fixed;
      background-color: #000;
      color: #f5e6c8;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255,215,0,0.6);
    }

    .intro {
      margin: 0 0 20px 0;
      line-height: 1.5;
      font-size: 15px;
    }

    /* Mismo estilo que el botón "Volver a jugar" del juego */
    .btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 24px;
      border: 2px solid #ffd700;
      background: transparent;
      color: #ffd700;
      font-size: 14px;
      text-decoration: none;
    }

    .btn:active {
      background: rgba(255,215,0,0.2);
    }

    .marker {
      margin: 32px 0 0 0;
    }

    .marker h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #ffd700;
    }

    /* Fondo blanco alrededor: la cámara necesita el borde claro para detectar el marcador */
    .marker img {
      display: block;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .bottom {
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🏰 Marcadores de la búsqueda</h1>
    <p class="intro">
      Abrí esta página en otra pantalla (compu o tablet) y escaneá cada marcador
      con la cámara del celular donde tenés el juego.
    </p>
    <a class="btn" href="index.html">Ir al juego</a>

    <section class="marker">
      <h2>Marcador 1</h2>
      <img src="markers/hiro.png" alt="Marcador 1 (Hiro)">
    </section>

    <section class="marker">
      <h2>Marcador 2</h2>
      <img src="markers/kanji.png" alt="Marcador 2 (Kanji)">
    </section>

    <section class="marker">
      <h2>Marcador 3: la llave</h2>
      <img src="markers/llave.png" alt="Marcador 3 (la llave)">
    </section>

    <div class="bottom">
      <a class="btn" href="index.html">Ir al juego</a>
    </div>
  </main>
</body>
</html>
